<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9988 雅思听力词书 · 拼词练习</title>
<style>
  :root{
    --bg:#f2f6fb; --card:#fff; --ink:#1e2a3a; --sub:#64748b;
    --brand:#1f6feb; --ok:#1a9e5c; --err:#d64545; --line:#e2e8f0;
    --chip:#eef3fa; --a:#1f6feb; --b:#b45309;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  .wrap{max-width:720px;margin:0 auto;padding:12px 12px 90px}
  header{display:flex;align-items:center;gap:10px;padding:6px 2px 12px;position:sticky;top:0;background:var(--bg);z-index:5}
  header .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#1f6feb,#6a5cff);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
  header h1{font-size:16px;margin:0;line-height:1.2}
  header .sub{font-size:11px;color:var(--sub)}
  .card{background:var(--card);border-radius:16px;box-shadow:0 1px 2px rgba(20,40,70,.05);padding:14px;margin-bottom:10px}
  .bar{display:flex;gap:6px;justify-content:center;margin:6px 0}
  .seg{flex:1;height:8px;border-radius:5px;background:#e6edf6;overflow:hidden}
  .seg i{display:block;height:100%}
  .seg i.g{background:var(--ok)} .seg i.r{background:var(--err)} .seg i.b{background:var(--brand)}
  .stat{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;user-select:none}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn{border:none;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:600;cursor:pointer}
  .btn-p{background:var(--brand);color:#fff;width:100%}
  .btn-g{background:#eef1f6;color:var(--ink)}
  .btn:disabled{opacity:.45}
  .grp{font-size:12px;font-weight:700;color:var(--sub);padding:12px 4px 6px;display:flex;align-items:center;gap:8px}
  .grp .tag{font-size:10px;background:#e6edf6;border-radius:5px;padding:1px 7px}
  .unit{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
  .unit:last-child{border-bottom:none}
  .u-badge{width:44px;height:44px;border-radius:12px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:13px;line-height:1.1}
  .u-badge small{font-size:9px;font-weight:600;opacity:.85}
  .uA{background:#e4edfd;color:var(--a)} .uB{background:#fdf0dd;color:var(--b)} .uC{background:#e6f6ec;color:var(--ok)}
  .u-info{flex:1;min-width:0}
  .u-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .u-meta{font-size:11px;color:var(--sub);margin-top:2px}
  .arrow{color:#b7c2d0;font-size:18px}
  .toolbar{position:sticky;top:58px;background:var(--bg);padding:6px 0 8px;z-index:4;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .mini{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12px}
  .toolbar .sp{flex:1}
  .wrow{display:flex;gap:8px;padding:9px 2px;border-bottom:1px dashed var(--line);align-items:baseline;font-size:14px}
  .wrow .en{font-weight:700;font-size:15px;min-width:30%}
  .wrow .zh{color:var(--sub);font-size:13px;flex:1}
  .wrow.done .en{color:var(--ok)}
  .wrow .spk{flex:none;cursor:pointer;font-size:14px;padding:2px 6px;border-radius:8px;background:var(--chip)}
  .fab{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:min(90%,560px);z-index:9}
  .hid{display:none!important}
  .big{font-size:52px;font-weight:800;text-align:center;margin:4px 0}
  .mid{text-align:center;font-size:14px;color:var(--sub)}
  .prompt{min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .q-en{font-size:30px;font-weight:800;word-break:break-all;letter-spacing:.5px}
  .q-zh{font-size:21px;font-weight:600;line-height:1.5;word-break:break-all}
  .opt{display:block;width:100%;margin-top:9px;padding:13px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:15px;text-align:left;cursor:pointer;transition:.12s}
  .opt:active{transform:scale(.99)}
  .opt.correct{border-color:var(--ok);background:var(--ok-bg,#e4f6ec);font-weight:700}
  .opt.wrong{border-color:var(--err);background:var(--err-bg,#fdeaea)}
  .opt:disabled{opacity:.75;cursor:default}
  .answer{border:2px solid var(--line);border-radius:12px;font-size:22px;padding:11px 14px;width:100%;outline:none;letter-spacing:1px}
  .answer:focus{border-color:var(--brand)}
  .answer.ok{border-color:var(--ok);background:#e4f6ec}
  .answer.bad{border-color:var(--err);background:#fdeaea;color:var(--err)}
  .listen-btn{width:68px;height:68px;border-radius:50%;border:none;background:linear-gradient(135deg,#1f6feb,#4d9bff);color:#fff;font-size:28px;cursor:pointer;box-shadow:0 5px 14px rgba(31,111,235,.3)}
  .fb{min-height:24px;font-size:14px;margin:8px 2px 0;text-align:center}
  .meta-line{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin:2px 0 6px}
  .progress{height:6px;background:#e6edf6;border-radius:4px;overflow:hidden;margin:4px 0 10px}
  .progress i{display:block;height:100%;background:var(--brand);transition:width .25s}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#233447;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:20}
  .toast.show{opacity:.95}
  .search{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14px;outline:none;margin-bottom:4px}
</style>
</head>
<body>
<div class="wrap">

  <!-- 词书主页 -->
  <div id="v-book">
    <header>
      <div class="logo">拼</div>
      <div>
        <h1>9988 雅思听力词书</h1>
        <div class="sub" id="hd-sub"></div>
      </div>
    </header>
    <div class="card">
      <div class="chips" id="type-chips">
        <div class="chip on" data-t="en2zh">英选 中</div>
        <div class="chip on" data-t="zh2en">中选 英</div>
        <div class="chip on" data-t="spell">汉译英拼写</div>
        <div class="chip on" data-t="audio">🔊 听写</div>
      </div>
      <div class="row" style="display:flex;gap:8px;margin-top:10px;align-items:center">
        <label style="font-size:12px;color:var(--sub)">每轮题数</label>
        <select id="qty" class="mini">
          <option value="10">10</option><option value="20" selected>20</option>
          <option value="30">30</option><option value="0">单元全部</option>
        </select>
      </div>
    </div>
    <div class="card">
      <div class="stat"><span>📚 词库共 <b id="libN"></b> 词</span><span>错词本 <b id="wrongN" style="color:var(--err)"></b> 词</span><span id="accTxt"></span></div>
      <div class="bar"><div class="seg"><i id="segG" style="width:0;background:var(--ok)"></i></div><div class="seg"><i id="segR" style="width:0;background:var(--err)"></i></div></div>
      <button class="btn btn-g" id="btn-wrong" style="width:100%;margin-top:8px;padding:10px">📕 打开错词本</button>
    </div>
    <input class="search" id="search" placeholder="🔍 搜索单词 / 中文(按单元浏览)">
    <div id="unit-list"></div>
  </div>

  <!-- 单元词表 -->
  <div id="v-unit" class="hid">
    <header>
      <button class="btn btn-g mini" id="u-back" style="padding:8px 14px">‹ 返回</button>
      <div style="flex:1">
        <h1 id="u-title"></h1>
        <div class="sub" id="u-meta"></div>
      </div>
    </header>
    <div class="card" style="padding:10px">
      <div class="chips" id="u-chips">
        <div class="chip on" data-t="en2zh">英选 中</div>
        <div class="chip on" data-t="zh2en">中选 英</div>
        <div class="chip on" data-t="spell">汉译英拼写</div>
        <div class="chip on" data-t="audio">🔊 听写</div>
      </div>
      <div class="row" style="display:flex;gap:8px;margin-top:9px;align-items:center">
        <label style="font-size:12px;color:var(--sub)">每轮题数</label>
        <select id="u-qty" class="mini">
          <option value="10">10</option><option value="20" selected>20</option>
          <option value="30">30</option><option value="0">单元全部</option>
        </select>
      </div>
    </div>
    <div id="u-words" class="card" style="padding:6px 12px"></div>
    <div class="fab"><button class="btn btn-p" id="u-start" style="padding:14px">▶ 开始练习本单元</button></div>
  </div>

  <!-- 答题 -->
  <div id="v-quiz" class="hid">
    <header>
      <button class="btn btn-g mini" id="q-quit" style="padding:8px 14px">✕ 结束</button>
      <div style="flex:1;text-align:center">
        <div id="q-mode" style="font-size:12px;color:var(--sub)"></div>
        <div class="meta-line" style="margin:0"><span id="q-pos"></span><span id="q-score"></span></div>
      </div>
    </header>
    <div class="progress"><i id="q-prog" style="width:0"></i></div>
    <div class="card">
      <div class="prompt" id="q-prompt"></div>
      <div id="q-zone"></div>
      <div class="fb" id="q-fb"></div>
      <div class="row" id="q-act" style="display:flex;gap:10px;justify-content:center;margin-top:12px">
        <button class="btn btn-g" id="q-skip">跳过</button>
        <button class="btn btn-p" id="q-sub" style="min-width:120px">确定</button>
      </div>
    </div>
  </div>

  <!-- 结算 -->
  <div id="v-result" class="hid">
    <div class="card" style="text-align:center">
      <div class="big" id="r-big"></div>
      <div class="mid" id="r-line"></div>
      <div class="bar" style="margin-top:14px"><div class="seg"><i id="r-g" style="background:var(--ok)"></i></div><div class="seg"><i id="r-r" style="background:var(--err)"></i></div></div>
      <div id="r-wl" style="text-align:left;margin-top:12px"></div>
    </div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn btn-g" id="r-retry">重练错词</button>
      <button class="btn btn-g" id="r-again">再练一遍</button>
      <button class="btn btn-p" id="r-home">返回词书</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="words.js"></script>
<script>
"use strict";
const WORDS = (window.WORDS && window.WORDS.length) ? window.WORDS : [{u:'A1',un:'Unit A1 示例',en:'example',zh:'例子'}];
const LS = "pince9988.v2";
function load(){ try{ return JSON.parse(localStorage.getItem(LS)) || {t:0,c:0,w:{},g:{}} }catch(e){ return {t:0,c:0,w:{},g:{}} } }
let ST = load();
const save = () => localStorage.setItem(LS, JSON.stringify(ST));
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const norm = s => (s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const keyOf = w => w.u + "|" + w.en.toLowerCase();
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]] } return a }
function speak(t){
  try{
    const u = new SpeechSynthesisUtterance(t);
    u.rate = .82;
    const vs = speechSynthesis.getVoices();
    let v = vs.find(x=>/^en-gb/i.test(x.lang) && /daniel|serena/i.test(x.name))  // clear BrE
         || vs.find(x=>/^en-gb/i.test(x.lang))
         || vs.find(x=>/gb|uk|british/i.test(x.name+" "+x.lang))
         || vs.find(x=>/^en/i.test(x.lang));
    if(v){ u.voice = v; u.lang = v.lang; }
    else u.lang = "en-GB";
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
let toastT;
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1800) }
const views = ["book","unit","quiz","result"];
function show(v){ views.forEach(x=>$("v-"+x).classList.toggle("hid", x!==v)); window.scrollTo(0,0) }

/* ---------- 词书主页 ---------- */
function groupUnits(){
  const map = new Map();
  WORDS.forEach(w=>{ if(!map.has(w.u)) map.set(w.u,{u:w.u,un:w.un,list:[]}); map.get(w.u).list.push(w); });
  return map;
}
let UMAP = groupUnits();

function unitBadge(u){
  if(u==='CH1') return '<div class="u-badge uC">补<small>CH1</small></div>';
  const isB = u[0]==='B';
  return `<div class="u-badge ${isB?'uB':'uA'}">${u.replace(/[AB]/,'')}<small>${u[0]}</small></div>`;
}
function progressOf(unit){
  const arr = unit.list; let done=0;
  arr.forEach(w=>{ if(ST.g[keyOf(w)]) done++; });
  return {done, total:arr.length};
}
function unitOrder(a, b){
  const grp = u => u.u==='CH1' ? 'A' : u.u[0];
  const num = u => u.u==='CH1' ? 0 : parseInt(u.u.replace(/[AB]/,''),10);
  const ga = grp(a), gb = grp(b);
  if(ga !== gb) return ga < gb ? -1 : 1;
  return num(a) - num(b);
}
function renderBook(filter){
  const list = $("unit-list");
  const q = (filter||"").trim().toLowerCase();
  const units = [...UMAP.values()].sort(unitOrder);
  let html = "";
  const groups = [["A","第2章 · 听力答案词",units.filter(x=>x.u==='CH1'||x.u[0]==='A')],
                  ["B","第3章 · 同义替换词(剑11~19)",units.filter(x=>x.u[0]==='B')]];
  groups.forEach(([gid,title,arr])=>{
    if(!arr.length) return;
    html += `<div class="grp">${title}<span class="tag">${arr.reduce((s,u)=>s+u.list.length,0)} 词</span></div>`;
    arr.forEach(u=>{
      if(q && !(u.un.toLowerCase().includes(q) || u.list.some(w=>w.en.toLowerCase().includes(q)||w.zh.includes(q)))) return;
      const p = progressOf(u);
      const done = p.done?` · 已练 ${p.done}/${p.total}`:"";
      html += `<div class="unit" data-u="${u.u}">
        ${unitBadge(u.u)}
        <div class="u-info"><div class="u-name">${esc(u.un)}</div>
        <div class="u-meta">${p.total} 词${done}</div></div>
        <div class="arrow">›</div></div>`;
    });
  });
  list.innerHTML = html || `<div class="mid" style="padding:20px">没有匹配的单元或单词</div>`;
}
document.getElementById("unit-list").addEventListener("click", e=>{
  const el = e.target.closest(".unit"); if(!el) return;
  openUnit(el.dataset.u);
});
$("search").addEventListener("input", e=>renderBook(e.target.value));

/* ---------- 单元词表 ---------- */
let curUnit = null, curScope = "unit";   // curScope: unit | wrong
function openUnit(u){
  const info = UMAP.get(u); if(!info) return;
  curUnit = info; curScope = "unit";
  $("u-title").textContent = info.un;
  const p = progressOf(info);
  $("u-meta").textContent = `${p.total} 词 · 已练 ${p.done}`;
  const rows = info.list.map(w=>{
    const done = ST.g[keyOf(w)] ? 'done' : '';
    return `<div class="wrow ${done}"><span class="spk">🔊</span><span class="en">${esc(w.en)}</span><span class="zh">${esc(w.zh)}</span></div>`;
  }).join("");
  $("u-words").innerHTML = rows;
  $("u-start").textContent = "▶ 开始练习本单元";
  show("unit");
}
$("u-back").addEventListener("click", ()=>{ renderBook($("search").value); refreshHome(); show("book") });
document.getElementById("u-words").addEventListener("click", e=>{
  const sp = e.target.closest(".spk"); if(!sp) return;
  const en = sp.nextElementSibling.textContent;
  speak(en);
});
$("u-start").addEventListener("click", ()=>{
  const qty = parseInt($("u-qty").value,10);
  startQuiz(curUnit, qty);
});

/* ---------- 题型选择(两个位置共用逻辑) ---------- */
function bindChips(id, store){
  document.querySelectorAll("#"+id+" .chip").forEach(ch=>{
    ch.addEventListener("click", ()=>{
      const t = ch.dataset.t;
      if(store.has(t) && store.size>1){ store.delete(t); ch.classList.remove("on"); }
      else { store.add(t); ch.classList.add("on"); }
    });
  });
}
const TYPES_HOME = new Set(["en2zh","zh2en","spell","audio"]);
const TYPES_UNIT = new Set(["en2zh","zh2en","spell","audio"]);
bindChips("type-chips", TYPES_HOME);
bindChips("u-chips", TYPES_UNIT);

/* ---------- 答题 ---------- */
let quiz = null;
function startQuiz(unitInfo, qty){
  let pool;
  if(curScope==="wrong"){
    pool = WORDS.filter(w=>ST.w[keyOf(w)]);
  } else pool = unitInfo.list.slice();
  if(!pool.length){ toast("这个词库是空的"); return; }
  const types = curScope==="wrong" ? new Set(["en2zh","zh2en","spell","audio"]) : (curScope==="unit"?TYPES_UNIT:TYPES_HOME);
  if(!types.size) types.add("en2zh");
  let total = qty || pool.length;
  if(total>pool.length) total = pool.length;
  quiz = { list: shuffle(pool).slice(0,total), i:0, ok:0, bad:0, types:[...types] };
  renderQ(); show("quiz");
}
function typeOf(i){ const a=quiz.types; return a[i % a.length] }
let answered = false, curType = "en2zh";

function renderQ(){
  const w = quiz.list[quiz.i];
  answered = false;
  curType = typeOf(quiz.i);
  const nm = {en2zh:"英选中",zh2en:"中选英",spell:"汉译英拼写",audio:"🔊听写(听音拼写)"}[curType];
  $("q-mode").textContent = curScope==="wrong" ? "错词本 · " + nm : nm;
  $("q-pos").textContent = `第 ${quiz.i+1}/${quiz.list.length} 题`;
  $("q-score").textContent = `✓${quiz.ok}  ✗${quiz.bad}`;
  $("q-prog").style.width = (100*quiz.i/quiz.list.length)+"%";
  $("q-fb").innerHTML = "";
  const pr = $("q-prompt"), z = $("q-zone");
  pr.innerHTML = ""; z.innerHTML = "";
  $("q-skip").disabled = false;
  if(curType==="spell" || curType==="audio"){
    const showZh = curType==="spell";
    pr.innerHTML =
      `<div class="q-zh" id="q-zhshow" style="${showZh?'':'display:none'}">${esc(w.zh)}</div>
       <div style="display:flex;gap:10px;align-items:center;justify-content:center;margin-top:12px">
         <button class="listen-btn" id="q-listen">🔊</button>
       </div>
       ${curType==='audio'?`<div class="mini" id="q-zhbtn" style="margin-top:10px;cursor:pointer">💡 显示中文</div>`:''}`;
    z.innerHTML = `<input class="answer" id="q-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${curType==='audio'?'听发音,输入拼写…':'输入英文拼写…'}">`;
    $("q-act").classList.remove("hid");
    $("q-sub").disabled = false;
    $("q-listen").onclick = ()=>speak(w.en);
    if(curType==='audio'){
      $("q-zhbtn").onclick = ()=>{
        const el = $("q-zhshow");
        el.style.display = el.style.display==='none' ? '' : 'none';
        $("q-zhbtn").textContent = el.style.display==='none' ? '💡 显示中文' : '🙈 隐藏中文';
      };
      setTimeout(()=>speak(w.en), 350);
    }
    setTimeout(()=>{ const i=$("q-in"); if(i) i.focus() }, 60);
  } else {
    const fromEn = curType==="en2zh";
    pr.innerHTML = fromEn
      ? `<div class="q-en">${esc(w.en)}</div><button class="listen-btn" id="q-listen" style="margin-top:10px">🔊</button>`
      : `<div class="q-zh" style="font-size:23px">${esc(w.zh)}</div>`;
    $("q-act").classList.add("hid");
    const others = shuffle(WORDS.filter(x=>{
      if(x.u===w.u && x.en===w.en) return false;
      return fromEn ? x.zh !== w.zh : norm(x.en) !== norm(w.en);
    })).slice(0,3);
    const opts = shuffle([w].concat(others));
    const wrap = document.createElement("div");
    opts.forEach(o=>{
      const b=document.createElement("button");
      b.className="opt";
      b.textContent = fromEn ? o.zh : o.en;
      b._w = o;
      b.onclick = ()=>pickChoice(b);
      wrap.appendChild(b);
    });
    z.appendChild(wrap);
    $("q-listen").onclick = ()=>speak(w.en);
    if(fromEn) setTimeout(()=>speak(w.en), 250);
  }
}
function pickChoice(btn){
  if(answered) return;
  answered = true;
  const w = quiz.list[quiz.i];
  settle(keyOf(btn._w)===keyOf(w), btn);
}
function submitSpell(){
  if(answered) return;
  answered = true;
  const v = norm($("q-in").value), w = quiz.list[quiz.i];
  settle(norm(w.en)===v, null);
}
$("q-sub").addEventListener("click", submitSpell);
document.addEventListener("keydown", e=>{
  if(!quiz || $("v-quiz").classList.contains("hid")) return;
  if(e.key==="Enter" && (curType==="spell"||curType==="audio")){ e.preventDefault(); submitSpell(); }
});
$("q-skip").addEventListener("click", ()=>{ if(answered) return; answered=true; settle(false,null); });
function settle(right, pickedBtn){
  const w = quiz.list[quiz.i];
  const k = keyOf(w);
  ST.t++;
  if(right){ ST.c++; ST.g[k]=1; if(ST.w[k]) delete ST.w[k]; quiz.ok++; }
  else { if(!ST.w[k]) ST.w[k]={zh:w.zh,un:w.un,u:w.u,miss:0}; ST.w[k].miss++; quiz.bad++; }
  save();
  $("q-score").textContent = `✓${quiz.ok}  ✗${quiz.bad}`;
  const fb=$("q-fb");
  if(curType==="spell" || curType==="audio"){
    const inp=$("q-in"); inp.disabled=true;
    inp.classList.add(right?"ok":"bad"); inp.value=w.en;
    fb.innerHTML = right?'<span style="color:var(--ok);font-weight:700">✓ 拼对了!</span>'
      :`<span style="color:var(--err)">✗ 正确答案:</span> <b style="color:var(--ok)">${esc(w.en)}</b>`;
    $("q-sub").disabled=true;
    const zh= $("q-zhshow");
    if(zh && zh.style.display==='none'){ zh.style.display=''; const b=$("q-zhbtn"); if(b) b.textContent='🙈 隐藏中文'; }
  } else {
    const opts = document.querySelectorAll("#q-zone .opt");
    opts.forEach(b=>{ b.disabled = true; });
    opts.forEach(b=>{
      if(keyOf(b._w)===keyOf(quiz.list[quiz.i])) b.classList.add("correct");
      else if(pickedBtn && b===pickedBtn) b.classList.add("wrong");
    });
    fb.innerHTML = right?'<span style="color:var(--ok);font-weight:700">✓ 回答正确</span>'
      :`<span style="color:var(--err)">✗ 选错了</span>`;
  }
  $("q-skip").disabled=true;
  setTimeout(next, right?700:1700);
}
function next(){
  if(quiz.i+1>=quiz.list.length){ finish(); return; }
  quiz.i++; renderQ();
}
function finish(){
  show("result");
  const acc = Math.round(100*quiz.ok/quiz.list.length);
  $("r-big").textContent = quiz.ok===quiz.list.length?"🎉 全对":acc>=80?"👍 很棒":acc>=60?"🙂 继续加油":"📚 再练练";
  $("r-line").textContent = `本轮 ${quiz.ok}/${quiz.list.length} 正确 · 正确率 ${acc}%`;
  $("r-g").style.width = acc+"%"; $("r-r").style.width = (100-acc)+"%";
  const wrongs = quiz.list.filter(w=>ST.w[keyOf(w)]);
  $("r-wl").innerHTML = wrongs.length
    ? `<div style="font-size:12px;color:var(--sub);margin-bottom:4px">本轮错词(已收错词本)</div>` +
      wrongs.slice(0,40).map(w=>`<div class="wrow"><span class="en">${esc(w.en)}</span><span class="zh">${esc(w.zh)}</span></div>`).join("")
    : `<div class="mid" style="padding:8px">本单元错词已清零 ✓</div>`;
}
$("q-quit").addEventListener("click", ()=>{ if(quiz){ refreshHome(); renderBook($("search").value);} show("book") });
$("r-home").addEventListener("click", ()=>{ refreshHome(); renderBook($("search").value); show("book"); });
$("r-again").addEventListener("click", ()=>{ startQuiz(curUnit, curScope==="wrong"?0:parseInt($("u-qty").value,10)); });
$("r-retry").addEventListener("click", ()=>{ startWrongBook(); });

/* ---------- 错词本 ---------- */
function startWrongBook(){
  const items = WORDS.filter(w=>ST.w[keyOf(w)]);
  if(!items.length){ toast("错词本是空的"); return; }
  curScope="wrong";
  curUnit = {un:"错词本", list: items};
  $("u-title").textContent = "错词本"; $("u-meta").textContent = `${items.length} 词`;
  $("u-words").innerHTML = items.map(w=>
    `<div class="wrow"><span class="spk">🔊</span><span class="en">${esc(w.en)}</span><span class="zh">${esc(w.zh)}</span></div>`).join("");
  startQuiz(curUnit, 0);
}
$("btn-wrong").addEventListener("click", ()=>{
  const items = WORDS.filter(w=>ST.w[keyOf(w)]);
  if(!items.length){ toast("错词本是空的,先去练几轮吧"); return; }
  curScope="wrong"; curUnit={un:"错词本",list:items};
  $("u-title").textContent="错词本"; $("u-meta").textContent=`${items.length} 词 · 答对自动移出`;
  $("u-words").innerHTML = items.map(w=>
    `<div class="wrow"><span class="spk">🔊</span><span class="en">${esc(w.en)}</span><span class="zh">${esc(w.zh)}</span></div>`).join("");
  $("u-start").textContent = "▶ 重练错词本";
  show("unit");
});

/* ---------- 主页统计 ---------- */
function refreshHome(){
  $("libN").textContent = WORDS.length;
  const wn = Object.keys(ST.w).length;
  $("wrongN").textContent = wn;
  $("accTxt").textContent = ST.t ? `正确率 ${Math.round(100*ST.c/ST.t)}%` : "还没有记录";
  const gp = ST.t?100*ST.c/ST.t:0;
  $("segG").style.width = gp+"%"; $("segR").style.width = (100-gp)+"%";
  const done = Object.keys(ST.g).length;
  $("hd-sub").textContent = `共 ${WORDS.length} 词 · ${UMAP.size} 个单元 · 已掌握 ${done} 词`;
}
renderBook();
refreshHome();
</script>
</body>
